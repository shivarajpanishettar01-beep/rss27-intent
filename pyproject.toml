[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usintent"
version = "0.1.0"
description = "Intent observability in learned robotic ultrasound scanning (RSS 2027 code)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
ml = ["torch>=2.1", "scikit-learn>=1.3", "pyarrow>=14"]
# pure-Python MCAP read/write of ROS 2 messages (bag converter, M5)
bags = ["mcap==1.6.0", "mcap-ros2-support==0.6.0"]
# LeRobot v3.0 dataset I/O; version pinned after reading its source (M1)
lerobot = ["lerobot[dataset,diffusion]==0.6.1; python_version >= '3.12'"]  # lerobot 0.6.1 needs Python >= 3.12
dev = ["pytest>=7.4", "ruff==0.17.3", "mypy==2.4.1", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["usintent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long Monte-Carlo or training tests", "lab: needs lab machine, GPU or private data"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["usintent.theory.*", "usintent.metrics.*"]
strict = true
