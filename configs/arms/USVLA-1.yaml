arm_id: "USVLA-1"
family: usvla             # US-VLA (ACM MM 2026; github.com/VMVLab/US-VLA), ultrasound-specific VLA
inputs: [bmode, camera, proprio]   # as A1/DP-1 + TCP pose: US-VLA predicts absolute TCP poses (its design)
intent_aware: false
uses_whenhead: false
seeds: 3
train_config: "pi05_ur_usfm_fusion"   # the released full model (USFM encoder + expert fusion)
checkpoint: "gs://openpi-assets/checkpoints/pi05_base/params"   # set inside that config; not overridden
usvla_commit: "dde576a"   # US-VLA commit the adapter was written against; check before the first run
schedule:                 # shared by every arm (SPEC 10); null until the GPU budget is known
  steps: null
  batch_size: null
  lr: null
sampler_controls:
  deterministic_noise: [true, false]
  integration_steps: [4, 16]
